
name: sijalink_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8

  # API & State Management
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_secure_storage: ^11.2.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

  # Location & Maps
  geolocator: ^14.1.2
  permission_handler: ^13.0.2
  google_maps_flutter: ^2.19.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Camera, Image & Video
  image_picker: ^1.2.4
  camera: ^0.12.2
  video_player: ^2.14.1

  # Date & Time
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
